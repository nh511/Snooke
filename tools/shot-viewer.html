<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snooker Shot Inspector</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f4f4;color:#222c29;font:14px system-ui,sans-serif;letter-spacing:0}header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:white;border-bottom:1px solid #bcc8c3;padding:12px 20px}h1{font-size:18px;margin:0}#status{color:#53625a;font-size:12px;overflow-wrap:anywhere}input[type=file]{max-width:100%;font-size:12px}main{max-width:1440px;margin:auto;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:16px}.workspace{min-width:0}canvas{width:100%;aspect-ratio:2/1;display:block;background:#154c36;border:1px solid #527965}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid #bdc9c3}button{height:34px;width:34px;border:1px solid #b1bfb8;background:white;border-radius:4px;font-size:18px;cursor:pointer}button:disabled{opacity:.4}input[type=range]{flex:1;min-width:110px}output{font-variant-numeric:tabular-nums}aside{min-width:0;border-left:1px solid #bdc9c3;padding-left:16px}h2{font-size:14px;margin:0 0 10px}#events{width:100%;height:390px;border:1px solid #bdc9c3;background:white;font:12px ui-monospace,monospace}dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:14px 0}dt{font-size:12px;color:#637169}dd{margin:3px 0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}#error{color:#9c2222;min-height:20px;overflow-wrap:anywhere}.flags{display:flex;gap:12px;flex-wrap:wrap;padding:8px 0;font-size:12px}@media(max-width:760px){main{grid-template-columns:1fr;padding:10px}aside{border-left:0;border-top:1px solid #bdc9c3;padding:12px 0}#events{height:150px}header{padding:10px;gap:10px}canvas{aspect-ratio:1.65/1}dl{gap:8px}}
</style>
<header><h1>Snooker Shot Inspector</h1><input type="file" id="files" multiple accept=".json,.csv" aria-label="Open result JSON and trajectory CSV"><span id="status">No shot loaded</span><a href="trajectory.html">Single Ball</a></header>
<main><div class="workspace"><canvas id="scene" width="1200" height="600" aria-label="Multi-ball shot trajectory"></canvas>
<div class="toolbar"><button id="back" disabled title="Previous step" aria-label="Previous step">&#8249;</button><button id="play" disabled title="Play or pause" aria-label="Play or pause">&#9654;</button><button id="next" disabled title="Next step" aria-label="Next step">&#8250;</button><input id="time" type="range" min="0" max="0" value="0" disabled aria-label="Physics step"><output id="counter">0.000 s</output></div>
<div class="flags"><label><input id="paths" type="checkbox" checked>Trajectories</label><label><input id="contacts" type="checkbox" checked>Contacts</label><label><input id="vectors" type="checkbox">Velocities</label><label><input id="normals" type="checkbox">Contact normals</label><label><input id="spin" type="checkbox">Angular vectors</label><label><input id="sleeping" type="checkbox">Sleeping state</label><label>View <select id="view"><option value="top">Top</option><option value="world">World</option></select></label></div>
<dl><div><dt>Step</dt><dd id="step">0</dd></div><div><dt>Time</dt><dd id="timeValue">0.000 s</dd></div><div><dt>Active Balls</dt><dd id="balls">0</dd></div><div><dt>Events</dt><dd id="eventCount">0</dd></div></dl><p id="error" role="alert"></p></div>
<aside><h2>Shot Events</h2><select id="events" size="18" aria-label="Jump to physics event"></select></aside></main>
<script src="shot-data.js"></script><script src="shot-viewer.js"></script></html>
