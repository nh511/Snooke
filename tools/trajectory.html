<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snooker Trajectory</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f3f5;color:#202528;font:14px system-ui,sans-serif;letter-spacing:0}header{background:white;border-bottom:1px solid #ccd2d5;display:flex;align-items:center;gap:20px;padding:14px 20px;flex-wrap:wrap}h1{font-size:18px;margin:0}main{max-width:1240px;margin:auto;padding:20px}.scene{width:100%;aspect-ratio:2/1;background:#143d30;display:block;border:1px solid #516058}section{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid #ccd2d5}button{width:36px;height:36px;border:1px solid #adb5bd;background:white;border-radius:4px;font-size:18px;cursor:pointer}button:disabled{opacity:.4;cursor:default}input[type=range]{flex:1;min-width:120px}output{font-variant-numeric:tabular-nums;min-width:120px}dl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;padding:16px 0;margin:0}dt{color:#586167;font-size:12px}dd{margin:4px 0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}#status{color:#606970;overflow-wrap:anywhere}#error{color:#a12626;min-height:22px;margin:0}@media(max-width:600px){main{padding:12px}header{padding:12px;gap:12px}dl{grid-template-columns:repeat(2,minmax(0,1fr))}.scene{aspect-ratio:1.6/1}input[type=file]{max-width:100%}}
</style>
<header><h1>Snooker Trajectory</h1><input id="file" type="file" accept=".csv,text/csv" aria-label="Open trajectory CSV"><span id="status">No trajectory loaded</span></header>
<main>
<canvas id="scene" class="scene" width="1200" height="600" aria-label="Table trajectory top view"></canvas>
<section>
<button id="back" disabled title="Previous physics step" aria-label="Previous physics step">&#x2039;</button>
<button id="play" disabled title="Play or pause" aria-label="Play or pause">&#x25b6;</button>
<button id="next" disabled title="Next physics step" aria-label="Next physics step">&#x203a;</button>
<input id="time" type="range" min="0" max="0" value="0" disabled aria-label="Physics timeline">
<output id="counter">0.000 s / 0</output>
</section>
<dl><div><dt>Step</dt><dd id="step">-</dd></div><div><dt>Linear speed (m/s)</dt><dd id="speed">-</dd></div><div><dt>Angular speed (rad/s)</dt><dd id="spin">-</dd></div><div><dt>State</dt><dd id="state">-</dd></div></dl>
<p id="error" role="alert"></p>
</main>
<script src="trajectory-data.js"></script>
<script>
'use strict';
const el=id=>document.getElementById(id), canvas=el('scene'), ctx=canvas.getContext('2d');
let rows=[], index=0, playing=false, last=0, playTime=0;
function pause(){playing=false;el('play').textContent='\u25b6';}
function draw(){
  const box=canvas.getBoundingClientRect(), ratio=window.devicePixelRatio||1;
  canvas.width=Math.max(1,Math.round(box.width*ratio));canvas.height=Math.max(1,Math.round(box.height*ratio));
  ctx.setTransform(ratio,0,0,ratio,0,0);ctx.fillStyle='#143d30';ctx.fillRect(0,0,box.width,box.height);
  if(!rows.length)return;
  const r=rows[index], scale=Math.min((box.width-40)/r.length,(box.height-40)/r.width), ox=box.width/2, oy=box.height/2;
  const point=v=>[ox+v.x*scale,oy-v.y*scale];
  ctx.strokeStyle='#b0bdb7';ctx.lineWidth=1;ctx.strokeRect(ox-r.length*scale/2,oy-r.width*scale/2,r.length*scale,r.width*scale);
  ctx.strokeStyle='#f3c55a';ctx.lineWidth=2;ctx.beginPath();
  for(let i=0;i<=index;i++){const p=point(rows[i]);i?ctx.lineTo(...p):ctx.moveTo(...p);}ctx.stroke();
  const p=point(r);ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(...p,Math.max(3,r.radius*scale),0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#7fd4df';ctx.beginPath();ctx.moveTo(...p);ctx.lineTo(p[0]+r.vx*scale*.4,p[1]-r.vy*scale*.4);ctx.stroke();
  el('time').value=index;el('counter').textContent=r.time.toFixed(3)+' s / '+rows.at(-1).time.toFixed(3)+' s';
  el('step').textContent=r.step;el('speed').textContent=Math.hypot(r.vx,r.vy,r.vz).toFixed(6);
  el('spin').textContent=Math.hypot(r.wx,r.wy,r.wz).toFixed(6);el('state').textContent=r.sleeping?'Sleeping':'Moving';
  el('back').disabled=index===0;el('next').disabled=index===rows.length-1;
}
function loadTrajectory(text,name){
  pause();const candidate=SnookerTrajectory.parse(text);rows=candidate;index=0;
  el('status').textContent=name+' | '+rows[0].version;el('error').textContent='';
  el('time').max=rows.length-1;el('time').disabled=false;el('play').disabled=false;draw();
}
window.loadTrajectory=loadTrajectory;
el('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>32*1024*1024)throw new Error('CSV exceeds 32 MiB');loadTrajectory(await f.text(),f.name);}catch(err){pause();el('error').textContent=err.message;}};
el('back').onclick=()=>{pause();index=Math.max(0,index-1);draw();};
el('next').onclick=()=>{pause();index=Math.min(rows.length-1,index+1);draw();};
el('time').oninput=e=>{pause();index=Number(e.target.value);draw();};
el('play').onclick=()=>{if(playing)pause();else{if(index===rows.length-1)index=0;playing=true;playTime=rows[index].time;last=performance.now();el('play').textContent='\u23f8';}};
function tick(now){if(playing&&rows.length){playTime+=(now-last)/1000;last=now;while(index<rows.length-1&&rows[index+1].time<=playTime)index++;if(index===rows.length-1)pause();draw();}requestAnimationFrame(tick);}requestAnimationFrame(tick);
window.addEventListener('resize',draw);draw();
</script>
</html>
